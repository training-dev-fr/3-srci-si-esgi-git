name: Déploiement

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Récupérer le dépot
        uses: actions/checkout@v4

      - name: Déployer
        run: scp -r ./scripts aurelien@vm-debian:/var/www/git
